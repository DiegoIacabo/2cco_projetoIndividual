<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Individual</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="cadastro-container">
        <div class="cadastro-header">
            <h1>Cadastre um novo festival</h1>
            <div class="codigo-decorativo"></div>
        </div>

        <div class="picote"></div>

        <div class="corpo">

            <div class="campo">
                <p>Nome <span class="obrigatorio">*</span></p>
                <input type="text" placeholder="Digite o nome do festival" id="ipt_nome">
            </div>

            <div class="campo">
                <p>Quantidade de atrações <span class="obrigatorio">*</span></p>
                <input type="number" placeholder="Ex: 12" id="ipt_qtdAtracoes">
            </div>

            <div class="linha-dupla">
                <div class="campo">
                    <p>Data de início <span class="obrigatorio">*</span></p>
                    <input type="date" id="ipt_dtInicio">
                </div>
                <div class="campo">
                    <p>Data de encerramento <span class="obrigatorio">*</span></p>
                    <input type="date" id="ipt_dtFim">
                </div>
            </div>

            <div class="campo">
                <p>Evento público <span class="obrigatorio">*</span></p>
                <input type="radio" id="sim" name="publico" value="true" />
                <label for="sim">Sim</label>
                <input type="radio" id="nao" name="publico" value="false" />
                <label for="nao">Não</label>
            </div>

            <div id="check_genero">
                <p>Gênero Musical<span class="obrigatorio">*</span></p>
            </div>

            <div class="campo">
                <p>Local <span class="obrigatorio">*</span></p>
                <select id="select_local">
                    <option value="0" selected disabled>Selecione um local</option>
                </select>
            </div>

            <button onclick="cadastrar()" class="btn-cadastrar">Cadastrar</button>

        </div>
    </div>

</body>

</html>

<script>

    window.onload = buscarGeneros();
    window.onload = buscarLocais();

    // Gêneros Musicais
    function buscarGeneros() {
        fetch(`http://localhost:8080/generos`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    criarCamposGeneros(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ check box: ${error.message}`);
            });
    }

    function criarCamposGeneros(resposta) {
        listaGeneros = Object.values(resposta);

        listaGeneros.forEach(genero => {
            id = genero.id;
            nome = genero.nome;

            check_genero.innerHTML += `
                <input type="checkbox" id="genero_${id}" value="${id}">
                <label for="genero_${id}">${nome}</label>
            `;
        });
    }

    // Locais dos Eventos
    function buscarLocais() {
        fetch(`http://localhost:8080/locais`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    criarCamposLocais(resposta);
                });
            } else {
                console.error("Nenhum dado encontrado ou erro na APi");
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ select: ${error.message}`);
            });
    }

    function criarCamposLocais(resposta) {
        listaLocais = Object.values(resposta);

        listaLocais.forEach(local => {
            id = local.id;
            nome = local.nome;

            select_local.innerHTML += `
                <option value="${id}">${nome}</option>
            `;
        })
    }

    // Cadastro
    function cadastrar() {

        var nome = ipt_nome.value;
        var qtdAtracoes = ipt_qtdAtracoes.value;
        var dataInicio = ipt_dtInicio.value;
        var dataFim = ipt_dtFim.value;
        var eventoPublico = document.querySelector('input[name="publico"]:checked').value;
        var local = document.getElementById("select_local").value;

        var generosSelecionados = document.querySelectorAll('[name="genero"]:checked');
        var generos = [];
        generosSelecionados.forEach((checkbox) => {
            generos.push(checkbox.value)
        });

        jsonCadastro = JSON.stringify({
            nome: nome,
            qtdAtracoes: qtdAtracoes,
            dtInicio: dataInicio,
            dtFim: dataFim,
            eventoPublico: eventoPublico,
            fkLocal: local,
            idGeneros: generos
        });

        console.log(jsonCadastro);

        fetch("http://localhost:8080/festivais", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: jsonCadastro
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {

                    console.log("Cadastro realizado com sucesso! Redirecionando para tela de Login...");

                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }

</script>
